<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade - OCTOLER</title>
        <script>
        (function() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme) {
                document.documentElement.classList.add(currentTheme);
            }
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/auth.js')}}"></script>
    <script src="{{ url_for('static', filename='js/auth-guard.js')}}"></script>
    <script src="{{ url_for('static', filename='js/theme.js')}}"></script>
</head>
<body>
    <header id="area-cabecalho">
        <div class="container-topo">
             <div class="container-topo">
            <div class="logo-container">
                <div id="area-logo">
                    <h1>OCTO<span class="destaque">LER</span></h1>
                </div>
            </div>
            
            <nav id="area-menu">
                <a href="{{ url_for('home')}}" class="ativo">Início</a>
                <a href="{{ url_for('mapa')}}">Trilhas</a>
                <a href="{{ url_for('contato')}}">Contato</a>
            </nav>

            <div class="settings-container">
                <button id="btn-settings" class="btn-icon" aria-label="Configurações">⚙️</button>
                <div id="settings-dropdown" class="dropdown-menu hidden">
                    <div class="dropdown-title">Acessibilidade</div>
                    <div class="config-item">
                        <span>Tema Escuro</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                    <div class="config-item mt-10">
                        <span>Modo Dislexia</span>
                        <label class="theme-switch">
                            <input type="checkbox" id="dyslexia-checkbox">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </header>

    <main id="area-atividade">
        <h2 id="titulo-atividade">Carregando...</h2>
        <div id="progresso-atividades" class="progresso-atividades"></div>

        <div class="iframe-wrapper">
            <iframe id="iframe-jogo" src="" allowfullscreen></iframe>
        </div>

        <button id="btn-proxima" class="btn-primario">Próxima atividade →</button>
    </main>

    <script src="{{ url_for('static', filename='js/jogos-data.js')}}"></script>
    <script src="{{ url_for('static', filename='js/atividades.js')}}"></script>
</body>
</html>
