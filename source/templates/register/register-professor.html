<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCTOLER - Cadastro Professor</title>
        <script>
        (function() {
            const currentTheme = localStorage.getItem('theme');
            if (currentTheme) {
                document.documentElement.classList.add(currentTheme);
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <header id="area-cabecalho">
        <div class="container-topo">
            <div class="logo-container">
                <div id="area-logo">
                    <h1>OCTO<span class="destaque">LER</span></h1>
                </div>
            </div>
            
            <nav id="area-menu">
                <a href="/pages/home.html">Início</a>
                <a href="#">Trilhas</a>
                <a href="/pages/contato.html">Contato</a>
            </nav>
    
            <div class="settings-container">
                <button id="btn-settings" class="btn-icon" aria-label="Configurações">⚙️</button>
                
                <div id="settings-dropdown" class="dropdown-menu hidden">
                    <p class="dropdown-title">Configurações</p>
                    
                    <div class="config-item">
                        <span>Modo Noturno</span>
                        <label class="theme-switch" for="checkbox">
                            <input type="checkbox" id="checkbox" />
                            <div class="slider round">
                                <span class="slider-icon sun">☀️</span>
                                <span class="slider-icon moon">🌙</span>
                            </div>
                        </label>
                    </div>
    
                    <div class="config-item mt-10">
                        <span>Fonte Acessível</span>
                        <label class="theme-switch" for="dyslexia-checkbox">
                            <input type="checkbox" id="dyslexia-checkbox" />
                            <div class="slider round slider-dyslexia">
                                <span class="slider-icon">a</span>
                                <span class="slider-icon">A</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main id="area-principal-cadastro">
        <div class="card-central ludico-card">
            <h2 class="titulo-login">Criar conta de Professor 📚</h2>
            <p class="subtitulo-cadastro">Preencha os dados para começar a usar.</p>

            <form id="cadastro-professor-form" action="{{ url_for('register_professor') }}" method="POST">
                <div class="dados">
                    <label for="nome-professor">Nome completo</label>
                    <input 
                    type="text" 
                    id="nome-professor" 
                    placeholder="Seu nome" 
                    name="nome"
                    required>
                </div>
                <div class="dados">
                    <label for="email-professor">E-mail</label>
                    <input 
                    type="email" 
                    id="email-professor" 
                    placeholder="seu@email.com" 
                    name="email"
                    required>
                </div>
                <div class="dados">
                    <label for="disciplina-professor">Disciplina (opcional)</label>
                    <input 
                    type="text" 
                    id="disciplina-professor" 
                    name="disciplina"
                    placeholder="Ex: Matemática">
                </div>
                <div class="dados">
                    <label for="senha-professor">Senha</label>
                    <input 
                    type="password" 
                    id="senha-professor" 
                    placeholder="********" 
                    name="senha"
                    required>
                </div>
                <div class="dados">
                    <label for="confirmar-senha-professor">Confirmar senha</label>
                    <input 
                    type="password" 
                    id="confirmar-senha-professor" 
                    placeholder="********" 
                    required>
                </div>
                <div class="btn-cadastrar">
                    <button type="submit" class="btn-primario">Cadastrar</button>
                </div>
                <div class="link-rodape-card">
                    <span>Já tem conta?</span> <a href="/pages/login/login-professor.html">Faça login</a>
                </div>
            </form>
        </div>
    </main>

    <footer id="rodape">
        <p>✨ Feito com carinho para pequenos grandes pensadores ✨</p>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js')}}"></script>
    <script src="{{ url_for('static', filename='js/login.js')}}"></script>
</body>
</html>
